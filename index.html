<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>Casa da Segurança | Automação</title>
<link rel="icon" id="fav" href="data:,">
<style>
:root{--bg:#0a1020;--bg2:#111b33;--card:#141f38;--bd:#22304f;--tx:#eef2fa;--mut:#8a97b3;--y1:#ffd21f;--y2:#ff9d00;--ok:#2fd18a;--bad:#ff5d5d}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 380px at 50% -120px,#1d2d55 0,transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg));
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 18px}
header img{height:54px;width:auto;display:block;filter:drop-shadow(0 2px 12px rgba(255,170,0,.18))}
header h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.status{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--bd);font-size:12.5px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:linear-gradient(180deg,#18243f,var(--card));border:1px solid var(--bd);border-radius:18px;min-height:128px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 10px 12px;cursor:pointer;color:var(--tx);
  transition:transform .12s,background .2s,box-shadow .2s,opacity .2s;-webkit-tap-highlight-color:transparent;user-select:none}
.card:active{transform:scale(.97)}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--mut);transition:.2s}
.ico svg{width:22px;height:22px}
.nome{font-size:15px;font-weight:600;text-align:center;word-break:break-word;line-height:1.2}
.est{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.card.on{background:linear-gradient(160deg,var(--y1),var(--y2));border-color:transparent;color:#2a1a00;box-shadow:0 8px 28px rgba(255,170,0,.28)}
.card.on .ico{background:rgba(42,26,0,.14);color:#2a1a00}
.card.on .est{color:rgba(42,26,0,.75)}
.card.off{opacity:.5}
.edit{position:absolute;top:5px;right:5px;width:30px;height:30px;border:0;background:none;color:inherit;opacity:.45;cursor:pointer;border-radius:8px;font-size:14px}
details{margin-top:24px;font-size:14px;color:var(--mut)}
summary{cursor:pointer;text-align:center}
.cfg{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:#0e172b;color:var(--tx);font:inherit}
.cfg button{padding:11px 16px;border-radius:10px;border:0;background:linear-gradient(160deg,var(--y1),var(--y2));color:#2a1a00;font:inherit;font-weight:600;cursor:pointer}
.topico{margin-top:8px;font-size:12px;word-break:break-all}
.nota{margin-top:22px;font-size:11.5px;color:var(--mut);text-align:center;opacity:.8}
</style>
</head>

    <h1>Automação</h1>
  </header>

  <div class="status">
    <div class="pill"><span class="dot" id="dSrv"></span><span id="tSrv">Conectando…</span></div>
    <div class="pill"><span class="dot" id="dMod"></span><span id="tMod">Módulo: aguardando</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <details>
    <summary>Configuração</summary>
    <div class="cfg">
      <input id="idDisp" placeholder="ID do dispositivo" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off">
      <button id="salvaId">Salvar</button>
    </div>
    <div class="topico" id="topico"></div>
  </details>

  <p class="nota">Servidor público de teste, sem senha. Não use em instalações reais.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
const N = 8;
const $ = id => document.getElementById(id);
$('fav').href = $('logo').src;

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let cfg = load('cfg', { id: '' });
let nomes = load('nomes', Array.from({length:N}, (_, i) => 'Relé ' + (i + 1)));
let estado = Array(N).fill(null);
let moduloOnline = false;
let conectado = false;
let client = null;

const base = () => 'automacao/' + cfg.id + '/';
const ICONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.4 6.8a8 8 0 1 0 11.2 0"/></svg>';

// ---------- Interface ----------
const grid = $('grid');
const cards = [];
for (let i = 0; i < N; i++) {
  const c = document.createElement('div');
  c.className = 'card off';
  c.setAttribute('role', 'button');
  c.tabIndex = 0;
  const ico = document.createElement('div'); ico.className = 'ico'; ico.innerHTML = ICONE;
  const nome = document.createElement('div'); nome.className = 'nome';
  const est = document.createElement('div'); est.className = 'est';
  const ed = document.createElement('button'); ed.className = 'edit'; ed.textContent = '✎'; ed.title = 'Renomear';
  c.append(ico, nome, est, ed);
  c.addEventListener('click', () => alterna(i));
  c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alterna(i); } });
  ed.addEventListener('click', e => {
    e.stopPropagation();
    const novo = prompt('Nome do botão:', nomes[i]);
    if (novo && novo.trim()) { nomes[i] = novo.trim(); save('nomes', nomes); desenha(); }
  });
  grid.appendChild(c);
  cards.push({ c, nome, est });
}

function desenha() {
  for (let i = 0; i < N; i++) {
    const { c, nome, est } = cards[i];
    nome.textContent = nomes[i];
    const s = estado[i];
    c.classList.toggle('on', s === 'ON');
    c.classList.toggle('off', !conectado || !moduloOnline || s === null);
    est.textContent = s === 'ON' ? 'Ligado' : s === 'OFF' ? 'Desligado' : '—';
  }
  $('dSrv').className = 'dot ' + (conectado ? 'ok' : 'bad');
  $('tSrv').textContent = conectado ? 'Servidor conectado' : 'Servidor desconectado';
  $('dMod').className = 'dot ' + (moduloOnline ? 'ok' : (conectado ? 'bad' : ''));
  $('tMod').textContent = 'Módulo: ' + (moduloOnline ? 'online' : 'offline');
  $('topico').textContent = cfg.id ? 'Escutando: ' + base() : '';
}

// ---------- MQTT ----------
function alterna(i) {
  if (!client || !conectado) return;
  const novo = estado[i] === 'ON' ? 'OFF' : 'ON';
  client.publish(base() + 'rele/' + (i + 1) + '/set', novo);
}

function conecta() {
  if (client) { client.removeAllListeners(); client.end(true); }
  estado = Array(N).fill(null);
  moduloOnline = false;
  conectado = false;
  desenha();

  const seguro = location.protocol === 'https:';
  const url = seguro ? 'wss://broker.hivemq.com:8884/mqtt' : 'ws://broker.hivemq.com:8000/mqtt';

  client = mqtt.connect(url, {
    clientId: 'painel-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });

  client.on('connect', () => {
    conectado = true;
    client.subscribe([base() + 'status', base() + 'rele/+/state']);
    desenha();
  });
  client.on('close', () => { conectado = false; moduloOnline = false; desenha(); });
  client.on('error', () => {});

  client.on('message', (topic, payload) => {
    const msg = payload.toString().trim().toUpperCase();
    if (topic === base() + 'status') {
      moduloOnline = msg === 'ONLINE';
    } else {
      const m = topic.slice(base().length).match(/^rele\/(\d+)\/state$/);
      if (m) {
        const n = parseInt(m[1], 10) - 1;
        if (n >= 0 && n < N && (msg === 'ON' || msg === 'OFF')) estado[n] = msg;
      }
    }
    desenha();
  });
}

$('idDisp').value = cfg.id;
$('salvaId').addEventListener('click', () => {
  const v = $('idDisp').value.trim();
  if (!v) return;
  cfg.id = v; save('cfg', cfg);
  conecta();
});

desenha();
if (typeof mqtt === 'undefined') {
  $('tSrv').textContent = 'Erro ao carregar biblioteca (verifique a internet)';
} else if (cfg.id) {
  conecta();
} else {
  document.querySelector('details').open = true;
  $('tSrv').textContent = 'Digite o ID em Configuração';
}
</script>
</body>
</html>
