<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Automação</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1f1f1d;--mut:#6b6b66;--bd:#d9d9d3;--on:#1d9e75;--onx:#fff;--bad:#d9534f}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#232321;--tx:#f0f0ec;--mut:#a3a39d;--bd:#3a3a37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.status{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-bottom:16px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:6px}
.dot.ok{background:var(--on)}.dot.bad{background:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:96px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:12px;cursor:pointer;font:inherit;color:var(--tx);transition:background .15s}
.card .nome{font-size:16px;font-weight:600;text-align:center;word-break:break-word}
.card .est{font-size:12px;color:var(--mut)}
.card.on{background:var(--on);border-color:var(--on);color:var(--onx)}
.card.on .est{color:var(--onx)}
.card.off{opacity:.55}
.edit{position:absolute;top:6px;right:8px;font-size:14px;background:none;border:0;color:inherit;opacity:.6;cursor:pointer;padding:4px}
details{margin-top:20px;font-size:14px}
summary{cursor:pointer;color:var(--mut)}
.cfg{display:flex;gap:8px;margin-top:10px}
input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.cfg button{padding:10px 14px;border-radius:8px;border:0;background:var(--on);color:#fff;font:inherit;cursor:pointer}
.nota{margin-top:18px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<h1>Painel de Automação</h1>
<div class="status">
  <span><span class="dot" id="dSrv"></span><span id="tSrv">Conectando ao servidor…</span></span>
  <span><span class="dot" id="dMod"></span><span id="tMod">Módulo: aguardando</span></span>
</div>

<div class="grid" id="grid"></div>

<details>
  <summary>Configuração</summary>
  <div class="cfg">
    <input id="idDisp" placeholder="ID do dispositivo" autocapitalize="off" autocomplete="off">
    <button id="salvaId">Salvar</button>
  </div>
</details>

<p class="nota">Servidor público de teste, sem senha. Não use em instalações reais.</p>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
const N = 8;
const $ = id => document.getElementById(id);

function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let cfg = load('cfg', { id: '' });
let nomes = load('nomes', Array.from({length:N}, (_, i) => 'Relé ' + (i + 1)));
let estado = Array(N).fill(null);
let moduloOnline = false;
let conectado = false;
let client = null;

const base = () => 'automacao/' + cfg.id + '/';

// ---------- Interface ----------
const grid = $('grid');
const cards = [];
for (let i = 0; i < N; i++) {
  const c = document.createElement('div');
  c.className = 'card off';
  c.setAttribute('role', 'button');
  c.tabIndex = 0;
  const nome = document.createElement('div'); nome.className = 'nome';
  const est = document.createElement('div'); est.className = 'est';
  const ed = document.createElement('button'); ed.className = 'edit'; ed.textContent = '✎'; ed.title = 'Renomear';
  c.append(nome, est, ed);
  c.addEventListener('click', () => alterna(i));
  c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alterna(i); } });
  ed.addEventListener('click', e => {
    e.stopPropagation();
    const novo = prompt('Nome do botão:', nomes[i]);
    if (novo && novo.trim()) { nomes[i] = novo.trim(); save('nomes', nomes); desenha(); }
  });
  grid.appendChild(c);
  cards.push({ c, nome, est });
}

function desenha() {
  for (let i = 0; i < N; i++) {
    const { c, nome, est } = cards[i];
    nome.textContent = nomes[i];
    const s = estado[i];
    c.classList.toggle('on', s === 'ON');
    c.classList.toggle('off', !conectado || !moduloOnline || s === null);
    est.textContent = s === 'ON' ? 'Ligado' : s === 'OFF' ? 'Desligado' : '—';
  }
  $('dSrv').className = 'dot ' + (conectado ? 'ok' : 'bad');
  $('tSrv').textContent = conectado ? 'Servidor conectado' : 'Servidor desconectado';
  $('dMod').className = 'dot ' + (moduloOnline ? 'ok' : (conectado ? 'bad' : ''));
  $('tMod').textContent = 'Módulo: ' + (moduloOnline ? 'online' : 'offline');
}

// ---------- MQTT ----------
function alterna(i) {
  if (!client || !conectado) return;
  const novo = estado[i] === 'ON' ? 'OFF' : 'ON';
  client.publish(base() + 'rele/' + (i + 1) + '/set', novo);
}

function conecta() {
  if (client) { client.removeAllListeners(); client.end(true); }
  estado = Array(N).fill(null);
  moduloOnline = false;
  conectado = false;
  desenha();

  const seguro = location.protocol === 'https:';
  const url = seguro ? 'wss://broker.hivemq.com:8884/mqtt' : 'ws://broker.hivemq.com:8000/mqtt';

  client = mqtt.connect(url, {
    clientId: 'painel-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });

  client.on('connect', () => {
    conectado = true;
    client.subscribe([base() + 'status', base() + 'rele/+/state']);
    desenha();
  });
  client.on('close', () => { conectado = false; moduloOnline = false; desenha(); });
  client.on('error', () => {});

  client.on('message', (topic, payload) => {
    const msg = payload.toString().trim().toUpperCase();
    if (topic === base() + 'status') {
      moduloOnline = msg === 'ONLINE';
    } else {
      const m = topic.slice(base().length).match(/^rele\/(\d+)\/state$/);
      if (m) {
        const n = parseInt(m[1], 10) - 1;
        if (n >= 0 && n < N && (msg === 'ON' || msg === 'OFF')) estado[n] = msg;
      }
    }
    desenha();
  });
}

$('idDisp').value = cfg.id;
$('salvaId').addEventListener('click', () => {
  const v = $('idDisp').value.trim();
  if (!v) return;
  cfg.id = v; save('cfg', cfg);
  conecta();
});

desenha();
if (typeof mqtt === 'undefined') {
  $('tSrv').textContent = 'Erro ao carregar biblioteca (verifique a internet)';
} else if (cfg.id) {
  conecta();
} else {
  document.querySelector('details').open = true;
  $('tSrv').textContent = 'Digite o ID do dispositivo em Configuração';
}
</script>
</body>
</html>
